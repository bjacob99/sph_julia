[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lagrangian_post_treatment"
version = "1.0"
description = "Post-treatment routines for the Lagrangian Stochastic Convection code"
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "toml",
    "progress"
]
